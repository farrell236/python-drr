name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[studio,test]"
      - run: python -m pytest
      - run: pydrr --help
      - run: pydrr-studio --help

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/studio/frontend/pnpm-lock.yaml
      - run: pnpm --dir apps/studio/frontend install --frozen-lockfile
      - run: pnpm --dir apps/studio/frontend build
      - run: git diff --exit-code -- src/pydrr_studio/static
